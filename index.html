let current = [];
function render() {
  const now = sydneyNow();
  document.getElementById("clock").textContent = `悉尼 ${DAYS[now.day]} ${now.label}`;
  current = filtered(now);
  const list = document.getElementById("list");
  list.replaceChildren(...current.slice(0, state.shown).map(row));
  if (!current.length) {
    const li = document.createElement("li"); li.className = "empty";
    li.textContent = state.mark ? "这里还没有标记过的店。在列表里点「回头」「想去」或「踩雷」就会出现在这里。"

    list.append(li);
  }
  const loc = state.area !== "near" ? "" : locState === "asking" ? " · 正在定位…" : locState === "denied" ? " · 没拿到定位，显示全悉尼。可以在上面选片区" : "";

}
document.getElementById("more").onclick = () => { state.shown += PAGE; render() };
function flashRow(p) {

  if (i < 0) return;

  const el = document.getElementById("p-" + p.id);
  if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }) }
}
document.getElementById("pick").onclick = () => {
  if (!current.length) return;
  const pool = current.slice(0, Math.min(8, current.length));
  const p = pool[Math.floor(Math.random() * pool.length)];
  focusPin(p, false); flashRow(p);
};

function toggleMark(p, k) {
  if (marks[p.id] === k) delete marks[p.id]; else marks[p.id] = k;
  ss.set("marks", JSON.stringify(marks));
  render();
}
document.getElementById("foot").textContent = `共 ${places.length} 家：Good Food Guide 2026 帽子店 + Google 评分 4.3 以上、评论 100 条以上的店。不含中餐、韩餐和快餐（帽子店除外）。数据更新于 ${META.updated}，营业时间以 Google 为准。你的标记只存在这台手机的浏览器里。`;

// ---- Map ----
let map = null, AdvancedMarker = null, pins = new Map(), meMarker = null;
function pinEl(p) {
  const el = document.createElement("div");
  el.className = p.hats ? "pin hat" : "pin";
  if (p.hats) el.innerHTML = HAT_SVG;
  el.title = p.name;
  return el;
}
function drawPins() {
  if (!map) return;
  const want = new Set(current.slice(0, MAX_PINS).map(p => p.id));
  for (const [id, m] of pins) if (!want.has(id)) { m.map = null; pins.delete(id) }
  for (const p of current.slice(0, MAX_PINS)) {
    if (pins.has(p.id)) continue;
    const m = new AdvancedMarker({ map, position: { lat: p.lat, lng: p.lng }, content: pinEl(p), title: p.name, zIndex: p.hats ? 2 : 1 });
    m.addListener("gmp-click", () => flashRow(p));
    pins.set(p.id, m);
  }
  if (me) {
    if (!meMarker) { const el = document.createElement("div"); el.className = "me"; meMarker = new AdvancedMarker({ map, position: me, content: el, title: "我", zIndex: 3 }) }
    else meMarker.position = me;
  }
}
function fitMap() {
  if (!map) return;
  if (state.area === "near" && me) {
    const r = state.radius || 5;
    map.setCenter(me); map.setZoom(r <= 1 ? 15 : r <= 2 ? 14 : 13);
    return;
  }
  const shown = current.slice(0, MAX_PINS);
  if (!shown.length) { map.setCenter(SYD); map.setZoom(12); return }
  const b = new google.maps.LatLngBounds();
  shown.forEach(p => b.extend({ lat: p.lat, lng: p.lng }));

    map = new Map(document.getElementById("map"), { center: SYD, zoom: 13, mapId: "DEMO_MAP_ID", colorScheme: dark ? "DARK" : "LIGHT", disableDefaultUI: true, zoomControl: true, clickableIcons: false, gestureHandling: "greedy" });

}

window.gm_authFailure = mapFailed;

buildArea(); buildFilters(); render();
if (state.area === "near") locate();
setInterval(render, 60000);
